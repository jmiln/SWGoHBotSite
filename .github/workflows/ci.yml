name: CI

# Release with `npm run release -- patch|minor|major` then `git push --follow-tags`; the tag
# publishes only after checks and build pass.

on:
  push:
    branches: [master]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [master]

# Least privilege by default; only `publish` widens this.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Spins up a MongoDB testcontainer via @testcontainers/mongodb; ubuntu-latest ships a
      # working Docker daemon, so this needs no extra setup.
      - name: Test
        run: npm test

  # Proves the image still builds on every change, without publishing it.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version and image name
        id: meta
        run: |
          set -euo pipefail
          tag_version="$GITHUB_REF_NAME"
          pkg_version="$(node -p "require('./package.json').version")"

          # Guards against a hand-rolled tag drifting from the manifest. npm version keeps these
          # in step, so a mismatch means the tag was not created the intended way.
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi

          # GHCR rejects uppercase, and some repo names have it
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reuses the layers the build job just made, via the shared gha cache.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha

      # A tag with no CHANGELOG.md section would publish an empty release; fail instead.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v heading="## [$GITHUB_REF_NAME]" '
            index($0, heading) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
